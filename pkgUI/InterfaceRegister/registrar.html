<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Gestión de Proyectos</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <h1 class="main-title">PLATAFORMA DE GESTIÓN DE PROYECTOS</h1>

    <div class="container">
        <div class="icon-container">
            <img src="../../Imagenes/Imagen.png" alt="Icono" class="register-icon">
        </div>

        <h2>CREAR CUENTA</h2>
        
        <form id="registerForm">
            <input type="text" id="ouid" placeholder="🆔 OUID (ID Único)" required>
            <input type="text" id="nombre" placeholder="👤 Nombre de usuario" required>
            <input type="email" id="email" placeholder="📧 Correo electrónico" required>
            <input type="password" id="pass" placeholder="🔒 Contraseña" required>
            
            <select id="rol" required>
                <option value="" disabled selected>Selecciona tu Rol</option>
                <option value="Admin">Administrador</option>
                <option value="Manager">Líder de Proyecto</option>
                <option value="Developer">Desarrollador</option>
            </select>
            
            <button type="submit" class="btn-register">REGISTRARSE</button>
        </form>

        <div class="footer-links">
            <p>¿Ya tienes cuenta? <a href="../../index.html">Inicia sesión aquí</a></p>
        </div>
    </div>

    <script src="registro.js"></script>
</body>
</html>
