<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Leader - Gestión de Tareas y Usuarios</title>
    <link rel="stylesheet" href="leader.css">
</head>
<body>
    <div class="container">
        <div class="tabs-nav">
            <button class="tab-button active" onclick="switchTab(event, 'tab-tareas')">📋 Generar Nueva Tarea</button>
            <button class="tab-button" onclick="switchTab(event, 'tab-usuarios')">👥 Modificar Usuarios</button>
        </div>

        <div id="tab-tareas" class="tab-content active">
            <h2>📋 Generar Nueva Tarea</h2>
            <p>Complete los datos para asignar al tablero del Developer</p>
            
            <form id="taskForm">
                <input type="text" id="nombreTarea" placeholder="Nombre de la Tarea" required>
                
                <textarea id="descripcion" placeholder="Descripción detallada..." required></textarea>
                
                <div class="row">
                    <div class="field">
                        <label>Fecha Inicio:</label>
                        <input type="date" id="fechaInicio" required>
                    </div>
                    <div class="field">
                        <label>Fecha Límite:</label>
                        <input type="date" id="fechaLimite" required>
                    </div>
                </div>

                <div class="field">
                    <label>Proyecto Asociado (ID Número):</label>
                    <input type="number" id="idProyecto" placeholder="Ej: 1, 2, 3..." min="1" required>
                </div>

                <div class="field">
                    <label>Asignar a Desarrollador:</label>
                    <select id="idUsuarioDesarrolla" required>
                        <option value="" disabled selected>Seleccione un desarrollador...</option>
                    </select>
                </div>

                <button type="submit" class="btn-send">🚀 Enviar a "Por Desarrollar"</button>
            </form>
        </div>

        <div id="tab-usuarios" class="tab-content">
            <h2>👥 Modificar Usuarios</h2>
            <p>Busque un usuario para actualizar sus datos o su rol</p>

            <form id="userModifyForm">
                <div class="row">
                    <input type="email" id="searchUserEmail" placeholder="Correo del usuario a buscar" required>
                    <button type="button" id="btnBuscarUsuario" class="btn-secondary">🔍 Buscar</button>
                </div>

                <input type="text" id="modificarNombre" placeholder="Nombre del Usuario" required disabled>
                <textarea id="modificarDescripcion" placeholder="Descripción..." disabled></textarea>
                
                <div class="field">
                    <label>Rol del Usuario:</label>
                    <select id="modificarRol" disabled>
                        <option value="0">Admin</option>
                        <option value="1">Leader</option>
                        <option value="2">Developer</option>
                    </select>
                </div>

                <button type="submit" id="btnGuardarUsuario" class="btn-save" disabled>💾 Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script src="leader.js"></script>
    
    <link rel="stylesheet" href="../ChatBot/chatbot.css">
    <script src="../ChatBot/chatbot.js"></script>

    <div class="esdeath-zona" id="esdeathZona">
        <div class="esdeath-chat" id="esdeathChat">
            <div class="bocadillo" id="esdeathSaludo">¡Saludos, subordinado!</div>
            <img src="/Imagenes/ImagenSaludando.png" alt="Esdeath">
            <input type="text" class="esdeath-input" placeholder="Haz tu pregunta aquí...">
        </div>
        <div class="pestana-luz"></div>
    </div>
</body>
</html>
