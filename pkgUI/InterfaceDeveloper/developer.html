<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Scrum - Developer</title>
    <link rel="stylesheet" href="developer.css">
    <script src="https://cdn.jsdelivr.net/npm/@learningml/ml@1/dist/learningml.min.js"></script>
</head>
<body>

    <h1>Tablero Scrum - Desarrollador</h1>

    <div class="scrum-board">
        <div class="column" id="col-todo">
            <h2>📝 Por Hacer</h2>
            <div id="tasks-todo"></div>
        </div>

        <div class="column" id="col-doing">
            <h2>⚙️ En Desarrollo</h2>
            <div id="tasks-doing"></div>
        </div>

        <div class="column" id="col-done">
            <h2>✅ Terminadas</h2>
            <div id="tasks-done"></div>
        </div>
    </div>

    <section style="max-width: 1100px; margin: 30px auto; padding: 20px; background: #11141d; border-radius: 10px; color: white;">
        <h2>🧠 Mis alertas (Prolog)</h2>
        <p style="color: #a0aec0; font-size: 0.9rem;">Tus tareas atrasadas y bloqueadas, y los proyectos en riesgo.</p>
        <button type="button" id="btnAlertasProlog" data-solo-usuario="true" style="padding: 10px 16px; background-color: #8e44ad; color: white; border: none; border-radius: 6px; cursor: pointer;">🧠 Analizar mis tareas</button>
        <div id="consolaProlog" style="margin-top: 15px; padding: 10px; background: #050a12; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #d2b4de; min-height: 100px; white-space: pre-wrap; overflow-y: auto; max-height: 350px; border: 1px solid rgba(142, 68, 173, 0.3);">Esperando orden...</div>
    </section>

    <script src="../Prolog/alertasProlog.js"></script>
    <script src="developer.js"></script>
    
    <link rel="stylesheet" href="../ChatBot/chatbot.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="../ChatBot/chatbot.js"></script>

    <div class="esdeath-zona" id="esdeathZona">
        <div class="esdeath-chat" id="esdeathChat">
            <div class="bocadillo" id="esdeathSaludo">¡Saludos, subordinado!</div>
            <img src="/Imagenes/ImagenSaludando.png" alt="Esdeath">
            <input type="text" class="esdeath-input" placeholder="Haz tu pregunta aquí...">
        </div>
        <div class="pestana-luz"></div>
    </div>

</body>
</html>
